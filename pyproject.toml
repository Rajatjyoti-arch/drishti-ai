[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drishti"
version = "0.1.0"
description = "Agentic Real-Time DAST for B2B Travel Ecosystems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Rajatjyoti-arch", email = "rajatb.0307@gmail.com" }
]
keywords = ["security", "dast", "ai-agents", "b2b-travel", "idor", "business-logic-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "playwright>=1.43.0",
    "networkx>=3.3",
    "fastapi>=0.111.0",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "black>=24.4.0",
    "ruff>=0.4.1",
]

[project.scripts]
drishti = "drishti.main:app"

[tool.hatch.build.targets.wheel]
packages = ["drishti"]

[tool.ruff]
line-length = 100
target-version = "py311"

